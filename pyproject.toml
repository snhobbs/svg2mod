[project]
name = 'svg2mod'
version = "1.1.0"
dynamic = ["dependencies"]
authors = [{ name = 'https://github.com/svg2mod' }]
requires-python = '>=3.8'
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Developers',
    'Intended Audience :: Manufacturing',
    'License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

description = "Convert an SVG file to a KiCad footprint."
keywords = ['svg2mod', 'inkscape', 'kicad', 'EDA', 'PCBNEW']
readme = "README.md"

[project.license]
file = "LICENSE"
name = "GPLv2+"

[project.scripts]
svg2mod = "svg2mod.cli:main"

[project.urls]
github = 'https://github.com/svg2mod/svg2mod'

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
"*" = ["*.svg2mod", "*.j2"]
svg2mod = ["*.svg2mod", "*.j2"]
kipart = ['*.gif', '*.png']

[tool.hatch.metadata]
allow-direct-references = true

[tool.setuptools.packages.find]
where = ['src']

[build-system]
requires = ["setuptools>=70", "setuptools-scm>=8.0"]
